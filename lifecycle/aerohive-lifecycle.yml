summary: >-
  Aerohive Networks was acquired by Extreme Networks (closed 2019-08-09). Its
  cloud-managed WiFi platform was rebranded/migrated to ExtremeCloud IQ, and the
  legacy Aerohive (HiveManager NG / ACS) developer API and its portal were
  retired. The legacy developer portal (developer.aerohive.com) carried a
  shutdown notice and the domain now resolves to 127.0.0.1 (offline). New
  developer accounts were no longer being issued; existing integrations were
  directed to migrate to the Extreme Platform ONE Developer Portal.
