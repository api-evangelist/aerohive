aid: aerohive
name: Aerohive
description: >-
  Aerohive Networks was a cloud-managed networking company founded in 2006 by
  Changming Liu and headquartered in Milpitas, California. It pioneered
  controller-less, cloud-managed Wi-Fi and edge networking, managed through its
  HiveManager NG (later ExtremeCloud IQ) platform and access points. Aerohive
  went public on the NYSE under the ticker HIVE and was acquired by Extreme
  Networks in a deal that closed on 2019-08-09 for approximately $272 million.
  The company operated an Aerohive Developer Program with a public developer
  portal (developer.aerohive.com) and REST APIs for the HiveManager NG / ACS
  platform, plus a GitHub organization of reference applications. Following the
  acquisition the products were folded into ExtremeCloud IQ, and the legacy
  Aerohive API and its developer portal were retired (shutdown dated
  2026-07-12), with integrators directed to migrate to the Extreme Platform ONE
  Developer Portal. This profile enriches the historical Aerohive API surface;
  it is a retired/acquired provider.
